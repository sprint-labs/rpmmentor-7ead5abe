name: Apply broadcast centre UX

on:
  push:
    branches:
      - codex/broadcast-centre-ux

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run broadcast centre transformer')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/broadcast-centre-ux

      - name: Apply code changes
        run: python3 scripts/apply-broadcast-centre-ux.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration manifest
        run: npm run check:migrations

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src supabase
          git commit -m "Improve broadcast centre UX"
          git push origin HEAD:codex/broadcast-centre-ux
